name: Orgnote
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.1"
  createIntermediateGroups: true
  # The Nix build of XcodeGen ships without its setting presets, so the
  # defaults Xcode templates normally provide are spelled out here.
  settingPresets: none
# Bundle ID, App Group and team come from here (and Config/Local.xcconfig).
configFiles:
  Debug: Config/Orgnote.xcconfig
  Release: Config/Orgnote.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: $(TARGET_NAME)
    SDKROOT: iphoneos
    ALWAYS_SEARCH_USER_PATHS: NO
    CLANG_ENABLE_MODULES: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    SWIFT_EMIT_LOC_STRINGS: YES
  configs:
    Debug:
      DEBUG_INFORMATION_FORMAT: dwarf
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: "0"
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: -Onone
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
      VALIDATE_PRODUCT: YES
packages:
  OrgKit:
    path: Packages/OrgKit
targets:
  Orgnote:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: OrgKit
      - target: OrgnoteWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Orgnote
        CFBundleDevelopmentRegion: ja
        # Read by the app and widget to find their shared container.
        OrgnoteAppGroup: $(ORGNOTE_APP_GROUP)
        # Notes kept on the device show up in Files › On My iPhone › Orgnote.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # No encryption of its own, so App Store Connect asks for no export documents.
        ITSAppUsesNonExemptEncryption: false
        NSCalendarsFullAccessUsageDescription: Googleカレンダーなど、iPhoneのカレンダーの予定をアジェンダに並べて表示します。予定を変更することはありません。
        # Matches the grouped list background so launch fades straight into the library.
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        # Widget taps open orgnote://agenda or orgnote://file?id=…&line=….
        CFBundleURLTypes:
          - CFBundleURLName: $(ORGNOTE_BUNDLE_ID)
            CFBundleURLSchemes:
              - orgnote
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORGNOTE_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        CODE_SIGN_STYLE: Automatic
        # App/Orgnote+iCloud.entitlements when the publisher turns on iCloud Drive.
        CODE_SIGN_ENTITLEMENTS: $(ORGNOTE_ENTITLEMENTS)
        # The iCloud script below edits the built Info.plist, which another
        # build step produces, so it cannot declare it as its own output.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Publish the iCloud Drive folder
        basedOnDependencyAnalysis: false
        showEnvVars: false
        script: |
          # Info.plist keys are not expanded from build settings, so the
          # container named in the xcconfig is added here, and only to builds
          # signed with the iCloud entitlements.
          case "$CODE_SIGN_ENTITLEMENTS" in *iCloud*) ;; *) exit 0 ;; esac
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          entry=":NSUbiquitousContainers:$ORGNOTE_ICLOUD_CONTAINER"
          /usr/libexec/PlistBuddy -c "Delete :NSUbiquitousContainers" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy \
            -c "Add :NSUbiquitousContainers dict" \
            -c "Add $entry dict" \
            -c "Add $entry:NSUbiquitousContainerIsDocumentScopePublic bool true" \
            -c "Add $entry:NSUbiquitousContainerName string Orgnote" \
            -c "Add $entry:NSUbiquitousContainerSupportedFolderLevels string Any" \
            "$plist"
  OrgnoteWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Orgnote
        OrgnoteAppGroup: $(ORGNOTE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ORGNOTE_BUNDLE_ID).widget
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Widget/OrgnoteWidget.entitlements
        SKIP_INSTALL: YES
