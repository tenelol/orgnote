name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # iOS 26.1 SDK needs Xcode 26.4, which the macOS 26 runner image ships.
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: OrgKit tests
        run: swift test --package-path Packages/OrgKit

      - name: Generate the project
        run: xcodegen generate

      # Hosted simulators sometimes time out launching the app, so a failed
      # test gets one more run before it fails the build.
      - name: End-to-end tests
        run: |
          xcodebuild test \
            -project Orgnote.xcodeproj \
            -scheme Orgnote \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)' \
            -retry-tests-on-failure -test-iterations 2 \
            -resultBundlePath TestResults.xcresult

      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
